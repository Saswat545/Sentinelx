    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SentinelX",
      "url": "https://sentinelx.site/",
      "description": "AI-powered smart contract security intelligence platform.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sentinelx.site/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is SentinelX?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SentinelX is an AI-powered blockchain security platform that analyzes Ethereum smart contracts and token addresses to identify potential rug-pull indicators, dangerous contract behaviors, privilege risks, and other security signals using machine learning and rule-based detection."
          }
        },
        {
          "@type": "Question",
          "name": "How does SentinelX calculate risk scores?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SentinelX uses an XGBoost machine learning model trained on a labeled smart-contract dataset, combined with 53 smart-contract feature extraction, rule-based security analysis, and SHAP-based model explainability to produce risk scores from 0-100."
          }
        },
        {
          "@type": "Question",
          "name": "Can SentinelX analyze any Ethereum contract?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SentinelX can analyze Ethereum smart contracts by address (fetching verified source code via Etherscan) or by pasting raw Solidity source code directly. It supports Ethereum mainnet and analyzes both verified and user-provided contracts."
          }
        },
        {
          "@type": "Question",
          "name": "Does a low risk score guarantee that a contract is safe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. SentinelX provides automated risk signals based on machine learning analysis and pattern detection. A low score does not guarantee safety. SentinelX identifies potential security risks but does not guarantee the safety or profitability of any asset."
          }
        },
        {
          "@type": "Question",
          "name": "Is SentinelX financial advice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. SentinelX is a security intelligence and risk-analysis tool. All analysis results are for informational and security-research purposes only and do not constitute financial, investment, or trading advice."
          }
        }
      ]
    }
    </script>
